/* Mode tableau inspiré du modèle partagé : plateau violet + scores sous les joueurs */
:root{--purple:#6c66b6;--purple-deep:#522b95;--sun:#ffd34d}
body{background:#50408d}
.shell{width:375px;max-width:375px;background:linear-gradient(180deg,#706abc 0%,#533096 100%);color:white}
.topbar{height:43px;background:#6862b1;border-bottom:1px solid #ffffff22}
.top-action{background:transparent;color:#ffe8ad;border-color:#ffffff55;min-height:32px;padding:0 10px}
.game-purple{background:linear-gradient(180deg,#6e6bbb,#58349e);color:#fff;gap:0}
.action-board{flex:0 0 auto;border:1px solid #e1dafa;border-radius:10px;margin:7px 9px 3px;padding:6px 7px 8px;display:flex;flex-direction:column;min-height:0;max-height:49%;}
.turn-title{display:flex;align-items:center;justify-content:space-between;font-size:17px;text-align:center;min-height:30px;gap:5px}
.turn-title span{font-size:12px;opacity:.89}.turn-title b{font-size:19px}.turn-nav{width:26px;height:27px;border:0;background:transparent;color:var(--sun);font-size:24px;line-height:1}
.pirate-cards{min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:4px 3px;overscroll-behavior:contain;align-content:start}
.pirate-card{border:1px solid #ece8ff;border-radius:7px;padding:5px 6px 4px;min-width:0;background:#ffffff08}
.pirate-name{font-weight:750;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;margin-bottom:4px}
.pirate-card-main{display:flex;align-items:center;gap:5px;justify-content:space-between;background:#ffffff0a;border:1px solid #ffffff22;border-radius:5px;padding:3px 4px;min-height:38px}
.card-count-label{font-size:10px;opacity:.85}.card-count strong{font-size:21px;font-weight:750;line-height:1.1}
.pirate-card .stepper-mini{gap:4px;flex-shrink:0}
.pirate-card .count-btn{background:#ffffff09;color:#ffe057;border:1px solid #ffda57;border-radius:5px;width:25px;height:29px;font-size:18px;font-weight:800}
.pirate-card .count-val{display:none}
.pirate-card .count-btn:disabled{opacity:.3}
.bet-remember{background:#ffffff17;border-radius:5px;padding:3px 5px;line-height:1.1;display:flex;align-items:center;gap:4px;font-size:11px;flex:0 0 auto}.bet-remember strong{font-size:16px;color:#ffe36b}.bet-remember span{font-size:11px;color:#ffe36b}
.card-bonus{margin-top:4px;width:100%;border:0;border-top:1px solid #ffffff24;background:none;text-align:center;color:#ffe07b;font-size:11px;padding:4px 0 0}.card-bonus span{font-size:14px}
.board-controls{min-height:34px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:3px 4px}.bet-note{font-size:10px;opacity:.85}
.kraken-small{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}.kraken-small .stepper-mini{gap:6px}.kraken-small .count-btn{width:26px;height:27px;background:#ffffff18;border:1px solid #eae7ff;color:#fff;border-radius:5px;font-size:18px}.kraken-small .count-val{font-size:13px;min-width:14px}
.rules-ghost{border:1px solid #ffffff8a;border-radius:5px;background:transparent;color:white;font-size:11px;padding:5px 8px}
.board-actions{display:flex;justify-content:center;padding:2px 0 0}.gold-action:disabled{opacity:.42;filter:grayscale(.6);cursor:not-allowed}.tricks-progress{text-align:center;font-size:10px;padding:1px 0 3px;color:#ffe8ac}.tricks-progress.ready{color:#c9ffe4}.gold-action{border:0;border-radius:6px;background:var(--sun);color:#24183f;font-weight:850;font-size:13px;min-height:34px;padding:5px 25px}
.score-board{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 8px 8px}.score-header{display:flex;justify-content:space-between;align-items:center;padding:8px 5px 5px;gap:4px}.score-header b{font-size:13px}.score-header small{font-size:9px;opacity:.75;text-align:right}
.scores-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.score-grid{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:calc(46px + 88px * var(--nplayers, 4));font-variant-numeric:tabular-nums;text-align:center}
.score-grid th,.score-grid td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 4px;font-size:13px;font-weight:450;min-width:85px}
.score-grid thead th{position:sticky;top:0;z-index:2;background:#6550ab;border-bottom:1px solid #f7cf49;font-size:12px;font-weight:750}
.score-grid thead .totals th{top:32px;background:#6244a8;border-bottom:2px solid #f7cf49;color:#f8d35e;font-size:16px}
.score-grid th.round-col,.score-grid tbody th,.score-grid thead .totals th:first-child{min-width:43px;width:43px;position:sticky;left:0;z-index:3;background:#634dab}
.score-grid thead .totals th:first-child{z-index:4;font-size:11px}
.score-grid tbody th{font-weight:750;font-size:13px;background:#583a9d}
.score-grid tbody td{border-bottom:1px solid #ffffff10}
.score-grid tbody tr.current-round td,.score-grid tbody tr.current-round th{color:#ffe079;background:#7451b3}
.score-grid .leader{color:#ffe079}
@media(min-width:500px){.pirate-cards{grid-template-columns:repeat(3,minmax(0,1fr))}.action-board{max-height:53%}}
@media(max-height:650px){.topbar{height:35px}.action-board{max-height:53%;margin-top:4px;padding:3px 6px}.pirate-card{padding:3px 5px}.pirate-name{margin-bottom:2px}.pirate-card-main{min-height:32px;padding:1px 3px}.card-count strong{font-size:17px}.turn-title{min-height:25px}.board-controls{min-height:28px}.gold-action{min-height:29px}}


/* V3: compact cards and global editing panels */
.pirate-card{padding:5px 6px 6px}
.pirate-card-main{min-height:69px;padding:5px 7px;align-items:stretch;gap:5px}
.card-values{display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;flex:1}
.card-count-label{font-size:11px;color:#eee8ff}
.card-count strong{font-size:24px;color:#fff}
.pirate-card .stepper-mini{display:flex;flex-direction:column;justify-content:center;gap:3px}
.pirate-card .count-btn{width:31px;height:29px}
.pirate-card .count-val{display:none}
.pirate-card .bet-remember{border:0;background:transparent;padding:0;color:#ffe573;display:block;font-size:10px}
.bet-remember strong{font-size:12px}
.board-tools{display:flex;gap:6px;align-items:center}
.board-tool{border:1px solid #ffdf73;background:#ffffff12;color:#ffe573;padding:6px 9px;border-radius:5px;font-size:12px;font-weight:800;min-height:30px}
.people-modal{display:flex;flex-direction:column;gap:0;margin-top:10px}
.people-modal-row{display:grid;grid-template-columns:minmax(0,1fr) 42px 41px 41px;gap:8px;align-items:center;padding:10px 1px;border-bottom:1px solid var(--line)}
.people-modal-name{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.people-modal-value{text-align:center;font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;color:#d85d48}
.people-modal-row .count-btn{width:40px;height:36px;background:white;font-size:18px;font-weight:850}
.people-modal-row .count-btn:disabled{opacity:.3}
.people-modal-check{grid-column:1/-1;display:flex;gap:7px;align-items:center;font-size:11px;color:var(--muted)}
.people-modal-check input{accent-color:var(--teal)}
.modal-hint{font-size:11px;color:var(--muted)}

/* V4: lean scores, legible modal, settings */
.card-values{gap:3px}
.card-count{display:flex;align-items:baseline;gap:4px;white-space:nowrap;color:#fff}
.card-count span{font-size:13px;font-weight:650;color:#fff}
.card-count strong{font-size:20px;color:#fff}
.pirate-card .bet-remember{color:#fff;font-size:12px;font-weight:500}
.pirate-card .bet-remember strong{color:#fff;font-size:12px;font-weight:850}
.pirate-card-main{min-height:62px}
.action-board{max-height:48%}
.score-board{padding-top:6px}
.topbar{gap:10px}
.topbar .brand{margin-right:auto}
.settings-action{font-size:20px;padding:0 7px;min-width:32px}
.sheet,.modal{color:#182d37;background:#fbf7ed}
.sheet h2,.modal h2{color:#182d37}
.sheet .people-modal-name,.sheet .people-modal-value,.sheet .rules-list,.sheet .rules-list li,.sheet .rules-list h3{color:#182d37}
.sheet .people-modal-row{border-bottom-color:#d5cebe}

<body>
  <div id="app" class="shell"></div>
  <script>
  (() => {
    'use strict';
    const KEY='skull-king-score-prototype-v03';
    const MAX_PLAYERS=10;
    const TOTAL_ROUNDS=10;
    const $app=document.getElementById('app');
    let game=null;
    let screen='home';
    let displayRound=1;
    let reviewingBids=false; // Navigation temporaire vers les paris enregistrés
    let draftNames=['',''];
    let modal=null;
    let toastTimer=null;

    const h=(s)=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    const id=()=>Math.random().toString(36).slice(2,10);
    const plural=(x,singular,pluralWord)=>x+' '+(x===1?singular:pluralWord);
    const fmt=(n,sign=true)=> n>0&&sign?'+'+n:String(n);
    const toast=(message)=>{clearTimeout(toastTimer);document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=message;document.body.appendChild(e);toastTimer=setTimeout(()=>e.remove(),2300);};

    function newRound(n,players){
      const r={number:n,phase:'bids',bids:{},tricks:{},bonuses:{},allowFailedBonus:{},harryDelta:{},originalBids:{},kraken:0};
      for(const p of players){r.bids[p.id]=0;r.tricks[p.id]=0;r.bonuses[p.id]=0;r.allowFailedBonus[p.id]=false;r.harryDelta[p.id]=0;r.originalBids[p.id]=0;}
      return r;
    }
    function blankGame(names) {
      const players=names.map(name=>({id:id(),name:name.trim()}));
      return {version:3,players,rounds:[newRound(1,players)],currentRound:1,finished:false,allowFailedBonusGlobal:true,created:Date.now()};
    }
    function activeRound(){return game?.rounds.find(r=>r.number===displayRound);}
    function getCurrent(){return game?.rounds.find(r=>r.number===game.currentRound);}
    function roundScore(r,pid){
      const bid=r.bids[pid]||0, tricks=r.tricks[pid]||0;
      const success=bid===tricks;
      const base=bid===0?(success?1:-1)*r.number*10:(success?bid*20:-10*Math.abs(bid-tricks));
      const bonus=(success||game.allowFailedBonusGlobal)?(r.bonuses[pid]||0):0;
      return {base,bonus,total:base+bonus,success};
    }
    function leaderboard(){
      if(!game)return[];
      return game.players.map((p,i)=>({ ...p, order:i, score:game.rounds.filter(r=>r.phase==='complete').reduce((sum,r)=>sum+roundScore(r,p.id).total,0)})).sort((a,b)=>b.score-a.score||a.order-b.order);
    }
    function save(){
      try {localStorage.setItem(KEY,JSON.stringify(game));}catch(e){/* Local storage can be blocked for file:// URLs. */}
    }
    function load(){
      try {const v=JSON.parse(localStorage.getItem(KEY));if(v?.version===3&&Array.isArray(v.players)&&Array.isArray(v.rounds))return v;}catch(e){}
      return null;
    }
    function createGame(names){
      if(names.length<2||names.length>MAX_PLAYERS||names.some(s=>!s.trim())){toast('Ajoute entre 2 et 10 prénoms.');return;}
      game=blankGame(names);
      screen='game';displayRound=1;reviewingBids=false;save();render(true);
    }
    function topbar(action=''){
      return `<header class="topbar"><div class="brand"><button type="button" class="brand-icon brand-home" data-action="home" aria-label="Retour à l’accueil" title="Accueil">☠</button><div><div class="brand-name">Skull King</div><div class="brand-sub">À l'abordage !</div></div></div>${action}</header>`;
    }

    function home(){
      const resume=game&&!game.finished;
      return `${topbar()}<main class="view home-content"><section class="home-panel"><h1>Que le meilleur pirate gagne.</h1><p>Paris, plis, bonus et classement, sans calcul et sans papier.</p><button class="btn btn-primary btn-full" data-action="setup">Nouvelle partie →</button></section><div class="stack">${resume?`<button class="btn btn-dark btn-full" data-action="resume">Reprendre la manche ${game.currentRound} →</button>`:''}</div></main>`;
    }

    function setupPlayerRow(name,i){
      return `<div class="field-row"><span class="field-index">${i+1}.</span><input class="field-input" data-name-index="${i}" aria-label="Prénom du joueur ${i+1}" placeholder="Nom du pirate" maxlength="26" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="words" enterkeyhint="${i===draftNames.length-1?'done':'next'}" value="${h(name)}"><button class="remove-btn" aria-label="Supprimer joueur ${i+1}" data-action="remove-player" data-index="${i}" ${draftNames.length<=2?'disabled':''}>×</button></div>`;
    }
    function setup(){
      return `${topbar()}<main class="view"><div class="setup-scroll" aria-label="Ajouter les joueurs"><div class="setup-head"><span class="eyebrow">Nouvelle partie</span><h1>Votre équipage</h1><p><span class="setup-count">Entre 2 et 10 joueurs</span> · <span class="setup-count">${draftNames.length}/10 joueurs ajoutés</span></p></div><div data-setup-rows>${draftNames.map((name,i)=>setupPlayerRow(name,i)).join('')}</div><button class="btn btn-soft add-player" data-action="add-player" ${draftNames.length===10?'disabled':''}>+ Ajouter un joueur</button></div><footer class="footer-dock"><button class="btn btn-primary" data-action="start">Commencer la partie →</button></footer></main>`;
    }

    function stepper(actionMinus,actionPlus,value,options={}){
      const min=options.min??0,max=options.max??999,step=options.step??1,pid=options.pid||'',aria=options.aria||'Compteur';
      return `<div class="stepper-mini" role="group" aria-label="${h(aria)}"><button class="count-btn" aria-label="Diminuer ${h(aria)} de ${step}" data-action="${actionMinus}" data-player="${h(pid)}" ${value<=min?'disabled':''}>−</button><span class="count-val">${value}</span><button class="count-btn" aria-label="Augmenter ${h(aria)} de ${step}" data-action="${actionPlus}" data-player="${h(pid)}" ${value>=max?'disabled':''}>+</button></div>`;
    }

    // Build only the player controls, without reconstructing the score table.
    function playerCards(r,play){
      return game.players.map(p=>{
        const bid=r.bids[p.id]||0,tricks=r.tricks[p.id]||0;
        const n=play?tricks:bid;
        return `<div class="pirate-card" data-card-player="${h(p.id)}"><div class="pirate-head"><div class="pirate-name">${h(p.name)}</div>${(r.bonuses[p.id]||0)?`<div class="bonus-badge ${r.bonuses[p.id]>0?'positive':'negative'}">${fmt(r.bonuses[p.id]||0)}</div>`:''}</div>
          <div class="pirate-card-main"><div class="card-values"><div class="card-count"><span>${play?'Plis :':'Pari :'}</span> <strong>${n}</strong></div>${play?`<div class="bet-remember">Pari : <strong>${bid}</strong></div>`:''}</div>
          ${stepper(play?'trick-minus':'bid-minus',play?'trick-plus':'bid-plus',n,{pid:p.id,max:play?r.number:999,aria:(play?'Plis':'Pari')+' de '+p.name})}</div></div>`;
      }).join('');
    }
    function gamePage(){
      const r=activeRound(),past=r.number!==game.currentRound,play=r.phase!=='bids'&&!reviewingBids;
      const tricksDone=game.players.reduce((sum,p)=>sum+(r.tricks[p.id]||0),0);
      const tricksAccounted=tricksDone+r.kraken;
      const canComplete=tricksAccounted===r.number;
      const complete=game.rounds.filter(x=>x.phase==='complete');
      const totals=Object.fromEntries(game.players.map(p=>[p.id,complete.reduce((sum,x)=>sum+roundScore(x,p.id).total,0)]));
      const maxScore=Math.max(...Object.values(totals));
      const rankedPlayers=[...game.players].sort((a,b)=>totals[b.id]-totals[a.id]||game.players.indexOf(a)-game.players.indexOf(b));
      const idx=game.rounds.findIndex(x=>x.number===r.number),prev=game.rounds[idx-1],next=game.rounds[idx+1];
      const totalBids=game.players.reduce((sum,p)=>sum+(r.bids[p.id]||0),0);
      const phaseLabel=`Paris ${totalBids} sur ${r.number}`;
      const canGoBack=reviewingBids||r.phase==='play'||Boolean(prev);
      const leftAction=(r.phase==='play'&&!reviewingBids)?'back-to-bids':'view-round';
      const leftRound=reviewingBids?(prev?.number||0):(prev?.number||0);
      const cards=playerCards(r,play);
      const rounds=game.rounds.filter(x=>x.number<=r.number);
      const table=`<div class="scores-scroll"><table class="score-grid"><thead><tr><th class="round-col">Tour</th>${rankedPlayers.map(p=>`<th title="${h(p.name)}">${h(p.name)}</th>`).join('')}</tr><tr class="totals"><th>Total</th>${rankedPlayers.map(p=>`<th class="${totals[p.id]===maxScore?'leader':''}">${totals[p.id]}</th>`).join('')}</tr></thead><tbody>${rounds.map(x=>`<tr class="${x.number===r.number?'current-round':''}"><th>${x.number}</th>${rankedPlayers.map(p=>`<td>${x.phase==='complete'?roundScore(x,p.id).total:'-'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      return `${topbar(`<button class="top-action" data-action="open-finish">Terminer</button><button class="top-action settings-action" data-action="open-settings" aria-label="Paramètres des bonus" title="Paramètres">⚙</button>`)}
       <main class="view game-purple" style="--nplayers:${game.players.length}"><section class="action-board" data-player-count="${game.players.length}"><div class="turn-title"><button class="turn-nav" aria-label="Manche précédente" data-action="${leftAction}" data-round="${leftRound}" ${!canGoBack?'disabled':''}>‹</button><div><b>Tour ${r.number}</b><span data-phase-label> — ${phaseLabel}</span></div><button class="turn-nav" aria-label="Manche suivante" data-action="${reviewingBids?'back-to-play':'view-round'}" data-round="${next?.number||0}" ${!next&&!reviewingBids?'disabled':''}>›</button></div>
       <div class="pirate-cards">${cards}</div>
       <div class="board-controls">${play?`<div class="kraken-small"><span>🐙 Kraken</span>${stepper('kraken-minus','kraken-plus',r.kraken,{max:99,aria:'Kraken'})}</div><div class="board-tools"><button class="board-tool" data-action="open-harry-list">Harry</button><button class="board-tool" data-action="open-bonus-list">💰 Bonus</button></div>`:'<span class="bet-note">Choisissez les paris de chaque joueur</span>'}
       </div><div class="board-actions">${past?`<button class="gold-action" data-action="current">Manche ${game.currentRound} ↗</button>`:!play?`<button class="gold-action" data-action="save-bids">${reviewingBids?'Enregistrer les paris':'Valider les paris'}</button>`:r.phase==='play'?`<button class="gold-action" data-action="complete-round" ${!canComplete?'disabled':''}>Valider la manche</button>`:`<button class="gold-action" data-action="current">Manche en cours</button>`}</div></section>
       <section class="score-board">${table}</section>
       </main>`;
    }

    function finalPage(){
      const rank=leaderboard(),lead=rank[0]?.score??0,winners=rank.filter(p=>p.score===lead).map(p=>p.name),total=game.rounds.filter(r=>r.phase==='complete').length;
      return `${topbar()}<main class="view"><div class="final-title"><div class="final-icon">🏆</div><h1>${winners.length===1?'Victoire de '+h(winners[0])+' !':'Victoire partagée !'}</h1><p>${total} manche${total>1?'s':''} validée${total>1?'s':''} · ${fmt(lead)} pts</p></div><div class="grid-legend" style="display:flex;justify-content:space-between"><span>Classement final</span><span>Points</span></div><div class="final-list">${rank.map((p,i)=>`<div class="final-row"><span class="position">${i===0?'♛':i+1}</span><span><strong>${h(p.name)}</strong></span><strong>${fmt(p.score)}</strong></div>`).join('')}</div><div class="final-actions"><button class="btn btn-primary btn-full" data-action="replay">Revanche avec les mêmes joueurs →</button><button class="btn btn-soft btn-full" data-action="setup">Nouvel équipage</button></div></main>`;
    }

    function modalHTML(){
      if(!modal)return'';
      if(modal.type==='bonus-list'){
        const r=activeRound();
        return `<div class="modal-backdrop sheet-wrap"><section class="sheet" role="dialog" aria-modal="true" aria-label="Bonus des joueurs"><div class="sheet-head"><h2>💰 Bonus</h2><button class="close-x" data-action="close-modal" aria-label="Fermer">×</button></div><div class="people-modal">${game.players.map(p=>`<div class="people-modal-row"><span class="people-modal-name">${h(p.name)}</span><span class="people-modal-value">${fmt(r.bonuses[p.id]||0)}</span><button class="count-btn" data-action="bonus-minus" data-player="${h(p.id)}" aria-label="Retirer 5 points de bonus à ${h(p.name)}">−</button><button class="count-btn" data-action="bonus-plus" data-player="${h(p.id)}" aria-label="Ajouter 5 points de bonus à ${h(p.name)}">+</button></div>`).join('')}</div>${rulesHTML()}<div class="sheet-footer"><button class="btn btn-dark" data-action="close-modal">Valider</button></div></section></div>`;
      }
      if(modal.type==='settings'){
        const r=activeRound();
        return `<div class="modal-backdrop sheet-wrap"><section class="sheet" role="dialog" aria-modal="true" aria-label="Paramètres"><div class="sheet-head"><h2>⚙ Paramètres</h2><button class="close-x" data-action="close-modal" aria-label="Fermer">×</button></div><p>Cette règle s'applique à tous les joueurs et à toutes les manches de la partie.</p><label class="settings-global"><span><strong>Compter les bonus même si le pari est raté</strong><small>Si désactivé, les bonus comptent uniquement lorsque le pari est réussi.</small></span><input type="checkbox" data-global-bonus ${game.allowFailedBonusGlobal?'checked':''} aria-label="Compter les bonus même si le pari est raté"></label><div class="sheet-footer"><button class="btn btn-dark" data-action="close-modal">Valider</button></div></section></div>`;
      }
      if(modal.type==='harry-list'){
        const r=activeRound();
        return `<div class="modal-backdrop sheet-wrap"><section class="sheet" role="dialog" aria-modal="true" aria-label="Harry le Géant"><div class="sheet-head"><h2>Harry le Géant</h2><button class="close-x" data-action="close-modal" aria-label="Fermer">×</button></div><p>Ajuster le pari de chaque joueur de −1 ou +1 par rapport à son pari initial.</p><div class="people-modal">${game.players.map(p=>{const original=r.originalBids[p.id]??r.bids[p.id],current=r.bids[p.id];return `<div class="people-modal-row"><span class="people-modal-name">${h(p.name)} <small style="display:block;font-size:10px;color:#68767e;font-weight:500">Initial : ${original}</small></span><span class="people-modal-value">${current}</span><button class="count-btn" data-action="harry-minus" data-player="${h(p.id)}" ${current<=Math.max(0,original-1)?'disabled':''} aria-label="Harry : retirer un pli à ${h(p.name)}">−</button><button class="count-btn" data-action="harry-plus" data-player="${h(p.id)}" ${current>=original+1?'disabled':''} aria-label="Harry : ajouter un pli à ${h(p.name)}">+</button></div>`}).join('')}</div><div class="sheet-footer"><button class="btn btn-dark" data-action="close-modal">Valider</button></div></section></div>`;
      }
      if(modal.type==='rules')return `<div class="modal-backdrop sheet-wrap"><section class="sheet" role="dialog" aria-modal="true" aria-label="Rappel des bonus"><div class="sheet-head"><h2>📖 Rappel des règles</h2><button class="close-x" data-action="close-modal" aria-label="Fermer">×</button></div>${rulesHTML()}<div class="sheet-footer"><button class="btn btn-dark" data-action="close-modal">Fermer</button></div></section></div>`;
      if(modal.type==='finish'){
        const unvalidated=game.rounds.some(r=>r.phase!=='complete');
        return `<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><h2>Terminer la partie ?</h2><p>Le classement final s'affichera immédiatement.</p>${unvalidated?'<div class="notice">La manche en cours n’est pas terminée : ses points ne seront pas comptabilisés.</div>':''}<div class="modal-buttons"><button class="btn btn-soft" data-action="close-modal">Continuer</button><button class="btn btn-danger" data-action="confirm-finish">Terminer</button></div></div></div>`;
      }
      if(modal.type==='harry'){
        const r=activeRound(),p=game.players.find(x=>x.id===modal.pid),original=r.originalBids[p.id]??r.bids[p.id];
        return `<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><h2>Harry le Géant</h2><p>Ajuster le pari enregistré de <b>${h(p.name)}</b> d'un pli maximum.</p><div class="harry-summary"><div><span>Pari initial</span><strong>${original}</strong></div><div><span>Pari actuel</span><strong>${r.bids[p.id]}</strong></div></div><div class="harry-control">${stepper('harry-minus','harry-plus',r.bids[p.id],{pid:p.id,min:Math.max(0,original-1),max:original+1,aria:'Ajustement Harry'})}</div><div class="modal-buttons"><button class="btn btn-soft" data-action="harry-reset">Réinitialiser</button><button class="btn btn-dark" data-action="close-modal">Valider</button></div></div></div>`;
      }
      if(modal.type==='replace')return `<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><h2>Remplacer la partie ?</h2><p>La partie actuelle sera remplacée. Une seule partie est sauvegardée sur ce téléphone.</p><div class="modal-buttons"><button class="btn btn-soft" data-action="close-modal">Annuler</button><button class="btn btn-danger" data-action="confirm-replace">Remplacer</button></div></div></div>`;
      return'';
    }
    function rulesHTML(){return `<div class="rules-list"><h3>Rappel · Captures spéciales</h3><ul><li>Sirène capturée par un pirate : <b>+20 pts</b></li><li>Pirate capturé par Skull King : <b>+30 pts</b></li><li>Skull King capturé par une sirène : <b>+40 pts</b></li></ul></div>`;}

    function openModal(next){
      modal=next;
      $app.querySelector('.modal-backdrop')?.remove();
      $app.insertAdjacentHTML('beforeend',modalHTML());
    }
    function closeModal(){
      modal=null;
      $app.querySelector('.modal-backdrop')?.remove();
    }
    // Updating the crew must not detach focused input nodes or rebuild the header/footer.
    function syncSetupRows(){
      const rows=$app.querySelector('[data-setup-rows]');
      if(!rows)return;
      const total=draftNames.length;
      for(const [i,row] of [...rows.children].entries()){
        const input=row.querySelector('[data-name-index]');
        const remove=row.querySelector('[data-action="remove-player"]');
        const index=row.querySelector('.field-index');
        if(index)index.textContent=(i+1)+'.';
        if(input){
          input.dataset.nameIndex=String(i);
          input.setAttribute('aria-label','Prénom du joueur '+(i+1));
          input.setAttribute('enterkeyhint',i===total-1?'done':'next');
        }
        if(remove){
          remove.dataset.index=String(i);
          remove.setAttribute('aria-label','Supprimer joueur '+(i+1));
          remove.disabled=total<=2;
        }
      }
      const count=$app.querySelector('.setup-count:last-child');
      if(count)count.textContent=total+'/10 joueurs ajoutés';
      const add=$app.querySelector('[data-action="add-player"]');
      if(add)add.disabled=total>=MAX_PLAYERS;
    }
    function render(scrollTop=false){
      const previousScroll=$app.querySelector('.player-scroll,.setup-scroll,.final-list')?.scrollTop||0;
      const previousModalScroll=$app.querySelector('.sheet')?.scrollTop||0;
      $app.innerHTML=screen==='home'?home():screen==='setup'?setup():screen==='final'?finalPage():gamePage();
      if(modal){$app.insertAdjacentHTML('beforeend',modalHTML());const sheet=$app.querySelector('.sheet');if(sheet)sheet.scrollTop=previousModalScroll;}
      if(!scrollTop){const el=$app.querySelector('.player-scroll,.setup-scroll,.final-list');if(el)el.scrollTop=previousScroll;}
    }

    // Only mutate the changed value/buttons: keep other cards, scroll and modal DOM intact.
    function setStepper(group,value,min,max){
      if(!group)return;
      const val=group.querySelector('.count-val');
      if(val)val.textContent=String(value);
      const minus=group.querySelector('[data-action$="-minus"]');
      const plus=group.querySelector('[data-action$="-plus"]');
      if(minus)minus.disabled=value<=min;
      if(plus)plus.disabled=value>=max;
    }
    function refreshCounterControls(action,pid){
      const r=activeRound();
      if(!r)return;
      const play=r.phase!=='bids'&&!reviewingBids;
      const card=pid?[...$app.querySelectorAll('[data-card-player]')].find(el=>el.dataset.cardPlayer===pid):null;
      const isBonus=action.startsWith('bonus-');
      const isHarry=action.startsWith('harry-');
      if(action.startsWith('bid-')||action.startsWith('trick-')||isHarry){
        const count=play?(r.tricks[pid]||0):(r.bids[pid]||0);
        if(card){
          const strong=card.querySelector('.card-count strong');
          if(strong)strong.textContent=String(count);
          const step=card.querySelector('.stepper-mini');
          if(step)setStepper(step,count,0,play?r.number:999);
          if(play){
            const remembered=card.querySelector('.bet-remember strong');
            if(remembered)remembered.textContent=String(r.bids[pid]||0);
          }
        }
      }
      if(isBonus&&card){
        const head=card.querySelector('.pirate-head');
        if(head){
          let chip=head.querySelector('.bonus-badge');
          const value=r.bonuses[pid]||0;
          if(!value){chip?.remove();}
          else{
            if(!chip){chip=document.createElement('div');head.appendChild(chip);}
            chip.className='bonus-badge '+(value>0?'positive':'negative');
            chip.textContent=fmt(value);
          }
        }
      }
      if(action.startsWith('kraken-')){
        const step=$app.querySelector('.kraken-small .stepper-mini');
        setStepper(step,r.kraken,0,99);
      }
      if(action.startsWith('bid-')||isHarry){
        const label=$app.querySelector('[data-phase-label]');
        if(label){
          const total=game.players.reduce((sum,p)=>sum+(r.bids[p.id]||0),0);
          label.textContent=' — Paris '+total+' sur '+r.number;
        }
      }
      if(play&&(action.startsWith('trick-')||action.startsWith('kraken-'))){
        const validation=$app.querySelector('[data-action="complete-round"]');
        if(validation){
          const total=game.players.reduce((sum,p)=>sum+(r.tricks[p.id]||0),0)+r.kraken;
          validation.disabled=total!==r.number;
        }
      }
      if(modal&&(isBonus||isHarry)){
        const list=$app.querySelector('.people-modal');
        const row=list?[...list.querySelectorAll('.people-modal-row')].find(el=>el.querySelector('[data-player="'+CSS.escape(pid)+'"]')):null;
        if(row){
          const value=isBonus?(r.bonuses[pid]||0):(r.bids[pid]||0);
          const shown=row.querySelector('.people-modal-value');
          if(shown)shown.textContent=isBonus?fmt(value):String(value);
          if(isHarry){
            const original=r.originalBids[pid]??r.bids[pid];
            const minus=row.querySelector('[data-action="harry-minus"]');
            const plus=row.querySelector('[data-action="harry-plus"]');
            if(minus)minus.disabled=value<=Math.max(0,original-1);
            if(plus)plus.disabled=value>=original+1;
          }
        }
        if(modal.type==='harry'&&isHarry){
          const current=$app.querySelector('.harry-summary div:nth-child(2) strong');
          if(current)current.textContent=String(r.bids[pid]||0);
          const original=r.originalBids[pid]??r.bids[pid];
          setStepper($app.querySelector('.harry-control .stepper-mini'),r.bids[pid],Math.max(0,original-1),original+1);
        }
      }
    }
    function modifyCounter(action,pid){
      const r=activeRound();if(!r)return;
      const val=action.endsWith('plus')?1:-1;
      if(action.startsWith('bid-')){
        if(r.phase!=='bids'&&!reviewingBids)return;
        r.bids[pid]=Math.max(0,Math.min(999,r.bids[pid]+val));
      }else if(action.startsWith('trick-')){
        if(r.phase==='bids'||reviewingBids)return;
        r.tricks[pid]=Math.max(0,Math.min(r.number,r.tricks[pid]+val));
      }else if(action.startsWith('bonus-')){
        if(r.phase==='bids'||reviewingBids)return;
        r.bonuses[pid]=Math.max(-9995,Math.min(9995,r.bonuses[pid]+val*5));
      }else if(action.startsWith('kraken-')){
        if(r.phase==='bids'||reviewingBids)return;
        r.kraken=Math.max(0,Math.min(99,r.kraken+val));
      }else if(action.startsWith('harry-')){
        const initial=r.originalBids[pid]??r.bids[pid];
        r.bids[pid]=Math.max(Math.max(0,initial-1),Math.min(initial+1,r.bids[pid]+val));
        r.harryDelta[pid]=r.bids[pid]-initial;
      }
      refreshCounterControls(action,pid);
      save();
    }
    $app.addEventListener('input',(e)=>{
      if(e.target.matches('[data-name-index]')){
        draftNames[Number(e.target.dataset.nameIndex)]=e.target.value;
      }
    });
    // Keep the mobile keyboard open when moving to the next pirate name.
    $app.addEventListener('keydown',(e)=>{
      if(e.key!=='Enter'||!e.target.matches('[data-name-index]'))return;
      const current=Number(e.target.dataset.nameIndex);
      const next=$app.querySelector('[data-name-index="'+(current+1)+'"]');
      if(next){e.preventDefault();next.focus({preventScroll:true});next.scrollIntoView({block:'nearest'});}
      else{e.preventDefault();e.target.blur();}
    });
    $app.addEventListener('change',(e)=>{
      if(e.target.matches('[data-global-bonus]')){
        game.allowFailedBonusGlobal=e.target.checked;
        save();
      }
    });
    $app.addEventListener('click',(e)=>{
      const button=e.target.closest('[data-action]');if(!button||button.disabled)return;
      const a=button.dataset.action,pid=button.dataset.player;
      if(a==='home'){screen='home';modal=null;render(true);return;}
      if(a==='setup'){
        if(game&&!game.finished&&screen!=='setup') {modal={type:'replace',next:'setup'};render();return;}
        draftNames=['',''];screen='setup';modal=null;render(true);return;
      }

      if(a==='resume'){screen='game';displayRound=game.currentRound;reviewingBids=false;render(true);return;}
      if(a==='add-player'){
        if(draftNames.length>=MAX_PLAYERS)return;
        const i=draftNames.length;draftNames.push('');
        $app.querySelector('[data-setup-rows]')?.insertAdjacentHTML('beforeend',setupPlayerRow('',i));
        syncSetupRows();return;
      }
      if(a==='remove-player'){
        if(draftNames.length<=2)return;
        const i=Number(button.dataset.index);
        if(!Number.isInteger(i)||i<0||i>=draftNames.length)return;
        draftNames.splice(i,1);
        button.closest('.field-row')?.remove();
        syncSetupRows();return;
      }
      if(a==='start'){createGame(draftNames);return;}
      if(a==='back-to-bids'){reviewingBids=true;render(true);return;}
      if(a==='back-to-play'){reviewingBids=false;render(true);return;}
      if(a==='view-round'){const n=Number(button.dataset.round);if(game.rounds.some(r=>r.number===n)){reviewingBids=false;displayRound=n;render(true);}return;}
      if(a==='current'){reviewingBids=false;displayRound=game.currentRound;render(true);return;}
      if(['bid-minus','bid-plus','trick-minus','trick-plus','bonus-minus','bonus-plus','kraken-minus','kraken-plus','harry-minus','harry-plus'].includes(a)){modifyCounter(a,pid);return;}
      if(a==='save-bids'){
        const r=activeRound();if((r.phase!=='bids'&&!reviewingBids)||r.number!==game.currentRound)return;
        r.phase='play';r.originalBids={...r.bids};
        for(const p of game.players)r.harryDelta[p.id]=0;
        reviewingBids=false;save();render(true);return;
      }
      if(a==='complete-round'){
        const r=activeRound();if(r.phase!=='play'||r.number!==game.currentRound||reviewingBids)return;
        const total=game.players.reduce((sum,p)=>sum+(r.tricks[p.id]||0),0)+r.kraken;
        if(total!==r.number){toast(`Plis : ${total} sur ${r.number} — corrige la saisie`);return;}
        r.phase='complete';
        if(r.number===TOTAL_ROUNDS){game.finished=true;screen='final';}
        else{game.currentRound=r.number+1;game.rounds.push(newRound(game.currentRound,game.players));displayRound=game.currentRound;}
        reviewingBids=false;save();render(true);return;
      }
      if(a==='open-finish'){openModal({type:'finish'});return;}
      if(a==='confirm-finish'){game.finished=true;screen='final';modal=null;save();render(true);return;}
      if(a==='open-settings'){openModal({type:'settings'});return;}
      if(a==='open-bonus-list'){openModal({type:'bonus-list'});return;}
      if(a==='open-harry-list'){openModal({type:'harry-list'});return;}
      if(a==='show-rules'){openModal({type:'rules'});return;}
      if(a==='harry'){openModal({type:'harry',pid});return;}
      if(a==='harry-reset'){const r=activeRound(),pid=modal.pid;r.bids[pid]=r.originalBids[pid];r.harryDelta[pid]=0;save();render();return;}
      if(a==='close-modal'){
        // The underlying game UI has already been updated by the counters.
        // Dismissing a dialog should not rebuild the page or score table.
        closeModal();
        return;
      }
      if(a==='confirm-replace'){
        const next=modal.next;modal=null;

        if(next==='setup'){draftNames=['',''];screen='setup';render(true);return;}
      }
      if(a==='replay'){game=blankGame(game.players.map(p=>p.name));screen='game';displayRound=1;reviewingBids=false;save();render(true);return;}
    });
    // Keyboard closing of dialogs.
    document.addEventListener('keydown',(e)=>{if(e.key==='Escape'&&modal)closeModal();});
    game=load();
    if(game && typeof game.allowFailedBonusGlobal !== 'boolean'){game.allowFailedBonusGlobal=false;save();}
    if(game){screen=game.finished?'final':'home';displayRound=game.currentRound;}
    render();
  })();
  </script>
</body>
</html>
